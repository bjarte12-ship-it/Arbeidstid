<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeidstid – flashcards</title>
<style>
:root{--bg:#f3f8f7;--ink:#0b3d40;--card:#fff;--muted:#5b7a7c;--teal:#00838f;--green:#00c39a;--dark:#0b3d40;--sh:0 12px 32px rgba(11,61,64,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081f21;--ink:#e8f5f3;--card:#0f3033;--muted:#8fb3b3;--dark:#06272a;--sh:0 12px 32px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#081f21;--ink:#e8f5f3;--card:#0f3033;--muted:#8fb3b3;--dark:#06272a;--sh:0 12px 32px rgba(0,0,0,.4)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Calibri,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px;box-sizing:border-box;overflow-x:hidden}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;margin:4px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.bar{width:100%;max-width:440px;height:6px;background:rgba(0,131,143,.18);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .3s}
.count{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.scene{width:100%;max-width:440px;height:320px;perspective:1200px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.front{background:linear-gradient(145deg,var(--dark),#00646e);color:#fff;overflow:hidden}
.front:before{content:"";position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;background:rgba(0,195,154,.25)}
.front:after{content:"";position:absolute;left:-50px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.front .tag{position:absolute;top:18px;left:20px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.front .term{font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:700;position:relative;z-index:1}
.front .hint{position:absolute;bottom:16px;font-size:.78rem;opacity:.65}
.back{background:var(--card);transform:rotateY(180deg);border:1px solid rgba(0,131,143,.2)}
.back .def{font-size:1.15rem;line-height:1.5;margin-bottom:16px}
.back .ex{background:rgba(0,195,154,.13);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;font-size:1rem;line-height:1.45;text-align:left;font-style:italic;width:100%;box-sizing:border-box}
.nav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(11,61,64,.12);transition:transform .1s}
button:active{transform:scale(.96)}
button.p{background:var(--teal);color:#fff}
button.ok{background:var(--green);color:#053a2e;font-weight:600}
.row2{display:flex;gap:10px;margin-top:12px}
.done{display:none;text-align:center;max-width:440px;margin-top:40px}
.done h2{font-family:Georgia,serif}
</style>
</head>
<body>
<h1>Arbeidstid</h1>
<div class="sub">Flashcards · A1/A2</div>
<div class="bar"><i id="pb"></i></div>
<div class="count" id="ct"></div>
<div class="scene" id="scene" tabindex="0" aria-label="Kort, trykk for å snu">
  <div class="card" id="card">
    <div class="face front"><span class="tag" id="tag"></span><div class="term" id="term"></div><span class="hint">Trykk for å snu</span></div>
    <div class="face back"><div class="def" id="def"></div><div class="ex" id="ex"></div></div>
  </div>
</div>
<div class="nav">
  <button id="prev">← Forrige</button>
  <button class="p" id="flip">Snu</button>
  <button id="next">Neste →</button>
</div>
<div class="row2">
  <button class="ok" id="know">✓ Jeg kan den</button>
  <button id="shuf">🔀 Bland</button>
  <button id="reset">↺ Start på nytt</button>
</div>
<div class="done" id="done"><h2>Bra jobba! 🎉</h2><p>Du har øvd på alle ordene.</p></div>
<script>
const ALL=[
["heltid","Du jobber 100 %. Det er en full jobb.","Jeg jobber heltid i en matbutikk.","Ord"],
["deltid","Du jobber mindre enn 100 %. Det er ikke full jobb.","Hun jobber deltid på sykehuset.","Ord"],
["fast arbeidstid","Du begynner og slutter til samme tid hver dag.","Jeg har fast arbeidstid. Jeg begynner kl. 7 og slutter kl. 15.","Ord"],
["full jobb","100 % stilling. 37,5 eller 40 timer i uka.","Jeg har full jobb.","Ord"],
["tidligvakt","Du begynner på jobb tidlig på dagen.","På mandag har jeg tidligvakt.","Ord"],
["senvakt","Du jobber seint på dagen eller på kvelden.","I dag har jeg senvakt.","Ord"],
["ekstravakt","En vakt i tillegg til vanlig arbeidstid.","Jeg tar ofte ekstravakter.","Ord"],
["å avspasere","Du tar fri fordi du har jobbet ekstra.","Jeg skal avspasere på fredag.","Ord"],
["å jobbe turnus","Du jobber ulike vakter etter en plan. For eksempel på sykehus.","Jeg jobber turnus. Jeg jobber hver tredje helg.","Ord"],
["å jobbe skift","Du jobber på ulike tider, for eksempel tidlig og seint.","Jeg jobber skift i butikken.","Ord"],
["fleksitid","Du kan velge når du kommer og går, mellom to klokkeslett.","Han kan komme mellom kl. 7 og kl. 9.","Ord"],
["kjernetid","Tiden du må være på jobb, også med fleksitid.","Kjernetid er kl. 9–15.","Ord"],
["ekstratid","Tid du jobber i tillegg til åtte timer.","Da får jeg ekstratid.","Ord"],
["Hvor mange timer jobber du i uka?","Spørsmål om arbeidstid.","Arbeidsuka mi er på 40 timer.","Uttrykk"],
["Jobber du fullt?","Spørsmål: Har du 100 % stilling?","Ja, jeg har en 100 % stilling.","Uttrykk"],
["Arbeidstiden min varierer.","Du jobber ikke til samme tid hver dag.","Arbeidstiden min varierer fra uke til uke.","Uttrykk"],
["Jeg må avtale det med sjefen.","Du må snakke med sjefen først.","Jeg vil jobbe lenger, men jeg må avtale det med sjefen først.","Uttrykk"]
];
let deck=[...ALL],i=0,known=new Set();
const $=id=>document.getElementById(id),card=$("card");
function render(){
  if(!deck.length)return;
  const c=deck[i];card.classList.remove("flip");
  $("term").textContent=c[0];$("def").textContent=c[1];$("ex").textContent="“"+c[2]+"”";$("tag").textContent=c[3];
  $("ct").textContent=`Kort ${i+1} av ${deck.length} · Kan: ${known.size}`;
  $("pb").style.width=(known.size/ALL.length*100)+"%";
  $("done").style.display="none";$("scene").style.display="";
}
function go(d){i=(i+d+deck.length)%deck.length;render()}
$("scene").onclick=()=>card.classList.toggle("flip");
$("flip").onclick=()=>card.classList.toggle("flip");
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("know").onclick=()=>{known.add(deck[i][0]);deck.splice(i,1);
  if(!deck.length){$("pb").style.width="100%";$("scene").style.display="none";$("ct").textContent="Ferdig!";$("done").style.display="block";return}
  i%=deck.length;render()};
$("shuf").onclick=()=>{deck.sort(()=>Math.random()-.5);i=0;render()};
$("reset").onclick=()=>{deck=[...ALL];known=new Set();i=0;render()};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();card.classList.toggle("flip")}
});
render();
</script>
</body>
</html>
